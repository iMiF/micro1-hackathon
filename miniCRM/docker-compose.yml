services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: minicrm
      POSTGRES_PASSWORD: minicrm
      POSTGRES_DB: minicrm
    ports:
      # Host 15432, not 5432: Homebrew/Postgres.app commonly already own 5432.
      - "127.0.0.1:15432:5432"
    volumes:
      - minicrm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minicrm -d minicrm"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  minicrm_pgdata:
